name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '15 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install bandit pip-audit
      - run: bandit -r src -ll
      - run: pip-audit
