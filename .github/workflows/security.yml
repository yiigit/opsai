name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Static and dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install bandit pip-audit
      - name: Scan source with Bandit
        run: bandit -r src -ll
      - name: Audit installed dependencies
        run: pip-audit
